
name: Secret Test

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Secret überprüfen
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret wurde erfolgreich geladen!"
          else
            echo "Secret fehlt!"
            exit 1
          fi
